function loadProjects(){

function loadBuyerDrafts() {
  google.script.run.withSuccessHandler(function(names) {
    console.log(names);
    const list = document.getElementById("buyerDraftList");
    list.innerHTML = "";
    names.forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      list.appendChild(option);
    });
  }).getBuyerDraftList();
}
window.onload = loadBuyerDrafts;
window.onload=loadProjects;
document.getElementById("buyerDraft").addEventListener("change", function() {
  const selectedValue = this.value;
  if (!selectedValue) return;

  // Split into [quotationNo, companyName]
  const [quotationNo, companyName] = selectedValue.split(" - ").map(s => s.trim());

  google.script.run.withSuccessHandler(function(data) {
    if (!data) {
      alert("No data found for this quotation.");
      return;
    }
    fillFormWithLoadedData(data); // ✅ existing function
  }).getQuotationByNumberAndCompany(quotationNo, companyName);
});
function fillFormWithLoadedData(data) {
  console.log("The received data", data);
  if (!data) return;

  // === Fill buyer details ===
  document.getElementById("buyerName").value = data.companyName || "";
  document.getElementById("buyerAddress").value = data.address || "";
  document.getElementById("buyerMobile").value = data.contact || "";
  document.getElementById("buyerEmail").value = data.email || "";

  // === Get table reference ===
  const table = document.getElementById("itemTable");

  // 🔹 Remove all rows except header (keep index 0)
  const rows = table.querySelectorAll("tr");
  rows.forEach((row, idx) => { if (idx > 0) row.remove(); });

  // 🔹 For each item, append a row based on the template
  data.items.forEach(item => {
    const newRow = document.createElement("tr");

    newRow.innerHTML = `
      <td><input type="text" class="itemNameInput" value="${item.itemName || ''}" autocomplete="off"></td>
      <td>
        <select class="itemCode">
          <option value="">-- Select Code --</option>
          <option value="${item.itemCode}" selected>${item.itemCode}</option>
        </select>
      </td>
      <td><input type="number" class="qty" value="${item.qty || 0}"></td>
      <td><input type="text" class="rate" value="${item.rate || 0}"></td>
      <td><input type="text" class="value" value="${(item.qty * item.rate).toFixed(2)}" disabled></td>
      <td>
        <select class="unit">
          <option value="">-- Select --</option>
          <option value="Unit 1" ${item.uom==='Unit 1'?'selected':''}>UNIT I</option>
          <option value="Unit 2" ${item.uom==='Unit 2'?'selected':''}>UNIT II</option>
        </select>
      </td>
      <td><input type="number" class="freight" value="${item.freight || 0}"></td>
      <td><input type="number" class="freightTotalItem" value="${(item.qty * (item.freight||0)).toFixed(2)}" readonly></td>
      <td><button type="button" class="action-btn" onclick="removeRow(this)">🗑️</button></td>
    `;
    table.appendChild(newRow);
    updateTotal();
  });
}

function validatePAN(input) {
  const value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  input.value = value.slice(0, 10);
  const errorSpan = document.getElementById("buyerPANError");
  const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]$/;

  if (value && !panRegex.test(value)) {
    errorSpan.textContent = "Invalid PAN format (ABCDE1234F)";
    return false;
  } else {
    errorSpan.textContent = "";
    return true;
  }
}

function validateGST(input) {
  const value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  input.value = value.slice(0, 15);
  const errorSpan = document.getElementById("buyerGSTError");
  const gstRegex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;

  if (value && !gstRegex.test(value)) {
    errorSpan.textContent = "Invalid GST format (22ABCDE1234F1Z5)";
    return false;
  } else {
    errorSpan.textContent = "";
    return true;
  }
}

function clearForm()
{
  const formPanel = document.querySelector(".form-panel");

  // Reset all input, textarea, and select fields
  formPanel.querySelectorAll("input, textarea, select").forEach(el => {
    if (el.type === "radio" || el.type === "checkbox") {
      el.checked = false;
    } else {
      el.value = "";
    }
  });

  // Clear dynamically added item rows (except header row)
  const itemTable = document.getElementById("itemTable");
  if (itemTable) {
    const rows = itemTable.querySelectorAll("tr:not(:first-child)");
    rows.forEach(row => row.remove());
  }
}

let itemList = [];
// Fetch item names from Google Sheets once
google.script.run.withSuccessHandler(function(items) {
  itemList = items;

  // After fetching itemList, initialize autocomplete for existing inputs
  document.querySelectorAll(".itemNameInput").forEach(input => {
    const suggestionBox = input.nextElementSibling; // assuming suggestion box is next sibling div
    setupAutocomplete(input, suggestionBox);
  });
}).getItemNames();

function setupAutocomplete(input, suggestionBox) {
  input.addEventListener("input", function () {
    const query = input.value.toLowerCase();
    suggestionBox.innerHTML = "";

    if (query) {
      const filtered = itemList.filter(item => item.toLowerCase().startsWith(query));
      filtered.forEach(item => {
        const div = document.createElement("div");
        div.textContent = item;
        div.onclick = () => {
          input.value = item;
          suggestionBox.style.display = "none";
        };
        suggestionBox.appendChild(div);
      });
      suggestionBox.style.display = filtered.length ? "block" : "none";
    } else {
      suggestionBox.style.display = "none";
    }
  });

  // Hide suggestions when clicking outside input and suggestion box
  document.addEventListener("click", function(e) {

//Item Validation
function itemValidation(items, statusEl, submitBtn) {
  let hasValidItem = false;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const itemName = item.itemName.trim();
    const qty = item.qty;

    const isEmptyRow = itemName === "" && qty === 0 && item.rate === 0;
    if (isEmptyRow) continue;

    if (itemName !== "") {
      if (qty > 0) {
        hasValidItem = true;
      } else {
        statusEl.textContent = `❌ Quantity must be greater than 0 for item at row ${i + 1}.`;
        statusEl.style.color = "red";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";

        // Optional: Highlight the row
        const itemTableRows = document.querySelectorAll("#itemTable tr:not(:first-child)");
        itemTableRows[i].style.backgroundColor = "#ffe6e6"; // light red
        return false;
      }
    }
  }

  if (!hasValidItem) {
    statusEl.textContent = "❌ Please enter at least one valid item with quantity > 0.";
    statusEl.style.color = "red";
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    return false;
  }

  return true;
}

//Item Validation ends

function updateTotal() {
  let orderValue = 0;
  let freightFromRows = 0;

  const rows = document.querySelectorAll("#itemTable tr:not(:first-child)");
  rows.forEach(row => {
    const value = parseFloat(row.querySelector(".value").value) || 0;
    const freight = parseFloat(row.querySelector(".freightTotalItem").value) || 0;
    orderValue += value;
    freightFromRows += freight;
  });

  document.getElementById("orderValue").value = orderValue.toFixed(2);

  // --- Freight logic ---
  const freightField = document.getElementById("freight");
  let finalFreight;

  if (freightField.dataset.manual === "true" && freightField.value.trim() !== "") {
    // user typed their own freight → keep it
    finalFreight = parseFloat(freightField.value) || 0;
  } else {
    // system auto calculates from rows
    finalFreight = freightFromRows;
    freightField.value = finalFreight.toFixed(2);
  }

  // --- Totals ---
  const totalAmount = orderValue + finalFreight;
  document.getElementById("totalAmount").value = totalAmount.toFixed(2);

  const totalGst = totalAmount * 0.18;
  document.getElementById("gstValue").value = totalGst.toFixed(2);

  const finalAmount = totalAmount + totalGst;
  document.getElementById("finalAmount").value = finalAmount.toFixed(2);
}

// when user types in Freight manually
document.getElementById("freight").addEventListener("input", function () {
  if (this.value.trim() !== "") {
    this.dataset.manual = "true"; // mark as manual
  } else {
    this.dataset.manual = "false"; // cleared → back to auto
  }
  updateTotal(); // recalc instantly
});
